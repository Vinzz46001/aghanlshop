<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - AGHA NL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-wrap">
            <a href="home.html" class="logo">AGHA NL</a>
            <div class="menu">
                <a href="home.html">Beranda</a>
                <a href="produk.html">Produk</a>
                <a href="tentang.html">Tentang Kami</a>
                <a href="kontak.html" class="aktif">Kontak</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <h1 style="text-align:center;">Hubungi Kami</h1>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr)); gap:2rem; margin-top:2rem;">
            <div style="background:white; padding:1.5rem; border-radius:12px; box-shadow:var(--bayangan);">
                <h3>📍 Alamat</h3>
                <p style="color:var(--abu-teks);">Cirebon, Jawa Barat<br>Indonesia</p>
            </div>
            <div style="background:white; padding:1.5rem; border-radius:12px; box-shadow:var(--bayangan);">
                <h3>📞 WhatsApp</h3>
                <p style="color:var(--abu-teks);">+62 xxx-xxxx-xxxx<br>Senin–Minggu, 08.00–21.00</p>
            </div>
            <div style="background:white; padding:1.5rem; border-radius:12px; box-shadow:var(--bayangan);">
                <h3>✉️ Email</h3>
                <p style="color:var(--abu-teks);">info@aghanlshop.my.id<br>Balas dalam 1×24 jam</p>
            </div>
        </div>
        <form class="form-kontak">
            <h3 style="text-align:center; margin-bottom:1rem;">Kirim Pesan</h3>
            <input type="text" placeholder="Nama Lengkap" required>
            <input type="email" placeholder="Email Anda" required>
            <textarea rows="4" placeholder="Tulis pesan Anda..." required></textarea>
            <button type="submit" class="tombol" style="width:100%;">Kirim Pesan</button>
        </form>
    </div>
    <footer><p>&copy; 2026 AGHA NL — Semua Hak Dilindungi</p></footer>
</body>
</html>
